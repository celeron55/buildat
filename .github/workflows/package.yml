# [SQUASHED_BRANCH] / [PACKAGING_CI] / [SQUASH_RELEASE]: the release
# archives, made the one way they are made -- util/package_in_docker.sh,
# the same image as on a desk -- on every tag. squash_push.sh tags each
# squash v<version>-<hash>, so a squash push builds and lands under
# Releases as a prerelease with the two tarballs and the zip; a plain
# v<version> tag placed by hand on a squash is the real release. The
# archives are workflow artifacts as well.
name: package
on:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # package_in_docker.sh names the archives by the short hash
          fetch-depth: 1
      - name: Package in the Linux image
        run: JOBS=$(nproc) util/package_in_docker.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archives
          path: Build/package/out/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: Build/package/out/smoke/
          if-no-files-found: ignore
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package in the Windows cross image
        run: JOBS=$(nproc) util/package_in_docker.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: Build/package/out/*-win64.zip
          if-no-files-found: error
      # The "Luanti only" archive ([LUANTI_BUILD]): games/vanilla and no
      # compiler, a third of the full one; the release lists it
      - uses: actions/upload-artifact@v4
        with:
          name: windows-luanti-archive
          path: Build/package/out/*-win64-luanti.zip
          if-no-files-found: error
      # The runtime variants ([WIN_DLL_INIT]), artifacts and not the
      # release's: the one that answers the desktop becomes the packaging
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-variants
          path: Build/package/out/*-win64-runtimes-*.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: Build/package/out/smoke/
          if-no-files-found: ignore
  # One release from both builds: two jobs on one tag would race on
  # creating it. A tag with a hash in it is a squash, a prerelease; a
  # bare v<version> is the release. No generated notes: the squash's
  # one commit says nothing worth a release note.
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-archives
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-archive
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-luanti-archive
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/*.tar.gz
            out/*.zip

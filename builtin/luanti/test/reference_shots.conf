# [OFFICIAL_SHOTS]: what pins official Luanti's picture, so the reference set
# can be re-taken by a script rather than by hand. The user's own
# minetest.conf is not touched.
#
# The shadow settings are the user's own, carried here explicitly rather than
# inherited: a reference taken under settings nobody wrote down is not a
# reference. Two levels at 93 nodes is practically the extension's
# CascadeParameters(24, 96, 0, 0, 0.8) and its shadowMapSize = 1024, which
# the two arrangements arrived at separately.
screen_w = 1280
screen_h = 720
fullscreen = false
autosave_screensize = false
show_debug = true

enable_shaders = true
enable_dynamic_shadows = true
shadow_levels = 2
shadow_map_max_distance = 93
shadow_map_texture_size = 1024
shadow_map_texture_32bit = true
shadow_filters = 0
shadow_map_color = false

# The run shares the user's desktop: sixty pictures is sixty pictures' worth
# of mineclone2 ambience over whatever they are actually doing. Both, so a
# client that ignores the first is still quiet.
mute_sound = true
sound_volume = 0

viewing_range = 150
enable_fog = false
time_speed = 0
name = ref

# A reference run is not a game. Without this a zombie kills the player and
# every shot after that is the "You died" dialog -- which is what happened on
# 2026-09-15, and it cost fifteen of sixteen pictures. It goes here rather
# than only in the generated world.mt because this is the file the server is
# actually started with.
enable_damage = false
